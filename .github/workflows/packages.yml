name: Test and build Veriyo Live
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux graphics libraries and fonts for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Install tested Qt versions
        run: python -m pip install -r packaging/requirements-windows.txt
      - name: Test application
        run: python main.py --self-test
      - name: Build independent Ubuntu deb and source ZIP
        run: |
          umask 022
          python packaging/build.py ubuntu --output outputs/ubuntu
      - name: Verify packaged sources, permissions and extracted application
        run: python packaging/verify_ubuntu.py outputs/ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: veriyo-ubuntu
          path: |
            outputs/ubuntu/*.deb
            outputs/ubuntu/*.zip
            outputs/ubuntu/SHA256SUMS
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned runtime and wheels
        shell: pwsh
        run: |
          python -m pip install ziglang==0.15.2
          python -m pip download --dest downloads --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --only-binary=:all: -r packaging/requirements-windows.txt
          python -c "import urllib.request; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip','downloads/python-3.12.10-embed-amd64.zip')"
      - name: Build Windows ZIP from verified dependencies
        shell: pwsh
        run: |
          $zig = python -c "import ziglang; from pathlib import Path; print(Path(ziglang.__file__).with_name('zig.exe'))"
          python packaging/build.py windows --output outputs/windows --cache downloads --zig $zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged Windows runtime without changing wallpaper
        shell: pwsh
        run: |
          $root = (Get-ChildItem outputs/windows -Directory | Where-Object Name -Like '*Windows*' | Select-Object -First 1).FullName
          & "$root/runtime/python.exe" "$root/main.py" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/runtime/python.exe" "$root/main.py" --export "$root/check.png" --at 2026-10-27T21:00:00+02:00
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $root
          & './runtime/python.exe' -c "from veriyo_live.platforms import WindowsBackend; assert isinstance(WindowsBackend().desktop_path(),str); print('PASS: native SystemParametersInfoW read')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseErrors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'veriyo_live/lock-screen.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          Pop-Location
      - name: Smoke check native desktop surface when Explorer is available
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $root = (Get-ChildItem outputs/windows -Directory | Where-Object Name -Like '*Windows*' | Select-Object -First 1).FullName
          & "$root/runtime/python.exe" "$root/packaging/check_windows_surface.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: veriyo-windows
          path: |
            outputs/windows/*.zip
            outputs/windows/SHA256SUMS
  ubuntu-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
          python -m pip install -r packaging/requirements-windows.txt
          python -m pip install 'numpy>=2.2,<3' 'Pillow>=11,<13'
      - name: Build all 45 Ubuntu live scenes from checked originals
        run: python tools/build_ubuntu_pack.py --output outputs/ubuntu-pack --jobs 2
      - name: Install the real pack and verify every frame in the packaged format
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/veriyo-pack-check
        run: python main.py --install-ubuntu-pack outputs/ubuntu-pack/Ubuntu-Live-Pack-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: veriyo-ubuntu-live-pack
          compression-level: 0
          path: |
            outputs/ubuntu-pack/*.zip
            outputs/ubuntu-pack/SHA256SUMS
  release:
    needs: [ubuntu, windows, ubuntu-pack]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: veriyo-*
          path: release-input
      - name: Verify tag and assemble release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import shutil
          from veriyo_live import VERSION
          assert os.environ['RELEASE_TAG'] == 'v'+VERSION, 'Tag and application version differ'
          output=Path('release-files')
          output.mkdir()
          files=[]
          for path in Path('release-input').rglob('*'):
              if path.suffix in ('.zip','.deb'):
                  target=output/path.name
                  assert not target.exists(),path.name
                  shutil.copyfile(path,target)
                  files.append(target)
          assert len(files)==5,'Expected application packages, source ZIP and both Ubuntu live pack archives'
          (output/'SHA256SUMS').write_text(''.join(sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(files)))
          notes='Veriyö Live '+VERSION+' — Ubuntu GNOME ja Windows 10/11.\n\n'
          notes+='Paketit on rakennettu ja tarkistettu molemmilla käyttöjärjestelmillä. Käyttöohjeet ja lukitusnäytön rajat ovat repon README.md-tiedostossa.\n\n'
          notes+='Windows: pura koko ZIP ja avaa Veriyo-Live.exe. Ubuntu: sudo apt install ./veriyo-live_'+VERSION+'_all.deb\n\n'
          notes+='Ubuntu-taustat: lataa Ubuntu-Live-Pack-1.0.0.zip, valitse sovelluksessa Ubuntun oletustaustat ja paina Asenna live-paketti. Valitse sitten Ubuntu-versio ja ota tausta käyttöön. Originals-ZIP on kehitysaineistoa.\n'
          Path('release-notes.md').write_text(notes)
          PY
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-files/*.zip release-files/*.deb release-files/SHA256SUMS --verify-tag --title "Veriyö Live ${RELEASE_TAG#v}" --notes-file release-notes.md
